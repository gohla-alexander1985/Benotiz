<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1565C0" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64B5F6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1E88E5" stop-opacity="0.3" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.4" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="0" y="0" width="512" height="512" rx="100" ry="100" fill="url(#bgGrad)" />
  <rect x="3" y="3" width="506" height="506" rx="97" ry="97" fill="none" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Subtle glow -->
  <circle cx="256" cy="236" r="160" fill="#42A5F5" opacity="0.12" />

  <!-- Big Bold "BE" -->
  <text x="256" y="240" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-weight="900" 
        font-size="220" 
        letter-spacing="-6" 
        fill="#FFFFFF" 
        filter="url(#shadow)">BE</text>

  <!-- Cursive "notiz" -->
  <text x="256" y="360" 
        text-anchor="middle" 
        font-family="'Brush Script MT', 'Segoe Script', 'Great Vibes', 'Caveat', 'Dancing Script', 'Snell Roundhand', cursive" 
        font-style="italic" 
        font-weight="600" 
        font-size="110" 
        letter-spacing="2" 
        fill="#90CAF9" 
        filter="url(#glow)">notiz</text>

  <!-- Stylus Flourish Underline -->
  <path d="M 146 410 Q 256 430 366 410" fill="none" stroke="#64B5F6" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />
</svg>
