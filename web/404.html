<!DOCTYPE html>
<html>
<head>
  <base href="/Benotiz/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="BEnotiz - A4 Notiz-App mit Mathe-KI und Aufgabenverwaltung">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BEnotiz">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>BEnotiz</title>
  <link rel="manifest" href="manifest.json">

  <style>
    .pwa-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(11, 19, 43, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 999999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .pwa-modal {
      background: #FFFFFF;
      max-width: 440px;
      width: 100%;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      text-align: center;
      border: 1px solid rgba(21, 101, 192, 0.2);
    }
    @media (prefers-color-scheme: dark) {
      .pwa-modal {
        background: #111D3B;
        color: #FFFFFF;
        border: 1px solid rgba(100, 181, 246, 0.25);
      }
      .pwa-subtitle {
        color: #B0BEC5 !important;
      }
      .pwa-btn-secondary {
        background: #1E2D52 !important;
        color: #E2EDF8 !important;
      }
    }
    .pwa-icon-wrapper {
      margin: 0 auto 16px auto;
      width: 84px;
      height: 84px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(21, 101, 192, 0.35);
    }
    .pwa-icon-wrapper img {
      width: 100%;
      height: 100%;
      display: block;
    }
    .pwa-title {
      font-size: 20px;
      font-weight: 800;
      margin: 0 0 8px 0;
      letter-spacing: -0.3px;
    }
    .pwa-subtitle {
      font-size: 14px;
      line-height: 1.5;
      color: #4A5568;
      margin: 0 0 20px 0;
    }
    .pwa-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .pwa-btn {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 14px 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-sizing: border-box;
    }
    .pwa-btn-primary {
      background: #1565C0;
      color: #FFFFFF;
    }
    .pwa-btn-secondary {
      background: #F1F5F9;
      color: #475569;
    }
  </style>
</head>
<body>
  <div id="pwa-install-overlay" class="pwa-overlay">
    <div class="pwa-modal">
      <div class="pwa-icon-wrapper">
        <img src="icons/Icon-192.png" alt="BEnotiz Icon">
      </div>
      <h2 class="pwa-title">BEnotiz auf diesem Gerät installieren?</h2>
      <p class="pwa-subtitle">
        Möchtest du die BEnotiz-Anwendung installieren und ein App-Icon auf deinem Startbildschirm erstellen?
      </p>
      <div class="pwa-actions">
        <button id="pwa-install-btn" class="pwa-btn pwa-btn-primary">
          Ja, Anwendung installieren
        </button>
        <button id="pwa-dismiss-btn" class="pwa-btn pwa-btn-secondary">
          Später
        </button>
      </div>
    </div>
  </div>

  <script>
    let deferredPrompt = null;
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (!isStandalone) {
        document.getElementById('pwa-install-overlay').style.display = 'flex';
      }
    });

    document.getElementById('pwa-install-btn').addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt = null;
      }
      document.getElementById('pwa-install-overlay').style.display = 'none';
    });

    document.getElementById('pwa-dismiss-btn').addEventListener('click', () => {
      document.getElementById('pwa-install-overlay').style.display = 'none';
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
